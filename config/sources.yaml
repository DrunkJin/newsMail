# 뉴스 소스 설정 — 카테고리별 RSS 피드
# 추가/제거하려면 이 파일만 수정하면 됩니다.
# RSS URL은 시간이 지나면 변경될 수 있으므로 작동 안 하면 해당 언론사 RSS 페이지에서 확인 후 갱신하세요.

# 기사 수집 시간 범위 (시간 단위) — 발송 직전 N시간 내 기사만 수집
lookback_hours: 12

# 카테고리당 요약에 사용할 최대 기사 수 (너무 많으면 토큰 낭비)
max_articles_per_category: 30

